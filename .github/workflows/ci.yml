name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.txt }
      # CPU-only torch keeps the install small; embeddings fall back to hashing if unavailable anyway.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pytest -q

  test-postgres:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: |
          grep -vi '^sentence-transformers' requirements.txt > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt
      - name: Create test database
        run: PGPASSWORD=ci psql -h localhost -U ci -d ci -c "create database ci_tests"
      - name: Migrate up, check for drift, down, up
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Test suite on PostgreSQL
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (slim variant)
        run: docker build --build-arg WITH_EMBEDDINGS=false -t career-agent-backend backend
      - name: Smoke test the container against Postgres
        run: |
          docker network create ci
          docker run -d --name db --network ci -e POSTGRES_PASSWORD=ci -e POSTGRES_USER=ci -e POSTGRES_DB=ci postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U ci && break; sleep 2; done
          docker run -d --name api --network ci -p 8000:8000 \
            -e ENVIRONMENT=production -e JWT_SECRET=$(python3 -c "import secrets;print(secrets.token_urlsafe(48))") \
            -e DATABASE_URL=postgresql+psycopg://ci:ci@db:5432/ci -e CORS_ORIGINS=http://localhost:5173 \
            career-agent-backend
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health/ready && exit 0; sleep 2; done
          docker logs api; exit 1
